[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvcp"
version = "0.1.0"
description = "TxnCausal: a transaction-causal transformer for next-item recommendation with co-purchases"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# The text-based baseline (ConcurrentBERT-NSP). Install INTO the venv
# (uv pip install -e ".[bert]"); `uv run --with` overlays resolve their own
# non-CUDA torch (silent CPU fallback).
bert = ["transformers>=4.55", "datasets>=3.0", "accelerate>=1.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# cu128 matches host driver 570.x (PyPI torch is cu130 → needs driver 580+); linux-only so macOS dev resolves torch from PyPI.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[project.scripts]
mvcp-prep = "mvcp.cli:prep"
mvcp-stats = "mvcp.cli:stats"
mvcp-train = "mvcp.cli:train"
mvcp-compare = "mvcp.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
